# Copy to .github/workflows/windows.yml in a Velyra repo, next to workflow-ubuntu.yml. Each platform has its own
# workflow so each gets its own README badge: GitHub badges show the status of a whole workflow, not of a job.
# All logic lives in the scripts next to this file, so the workflows of all repos stay identical and CI changes reach
# a repo when its VelyraBuildUtils submodule is updated.
name: Windows

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: bash VelyraBuildUtils/ci/configure.sh

      - name: Build
        shell: bash
        run: bash VelyraBuildUtils/ci/build.sh

      - name: Test
        shell: bash
        run: bash VelyraBuildUtils/ci/test.sh
