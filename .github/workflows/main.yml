# Copy to .github/workflows/main.yml in a Velyra repo. All logic lives in the scripts next to this file, so the
# workflows of all repos stay identical and CI changes reach a repo when its VelyraBuildUtils submodule is updated.
name: CI

on: [push, pull_request]

jobs:
  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: bash VelyraBuildUtils/ci/install-deps-linux.sh

      - name: Build and test
        run: bash VelyraBuildUtils/ci/build-and-test.sh

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and test
        shell: bash
        run: bash VelyraBuildUtils/ci/build-and-test.sh
